kind = "web"
previewPath = "/"
title = "Manaswini Anand — Portfolio"
description = "A personal software engineering portfolio for Manaswini Anand, showcasing her projects, skills, education, résumé, and contact links."
version = "1.0.0"
id = "artifacts/manaswini-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23513

[services.development]
run = "pnpm --filter @workspace/manaswini-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manaswini-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/manaswini-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23513"
BASE_PATH = "/"
